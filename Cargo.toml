[package]
name = "wisp-wm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small, keyboard-first Wayland compositor built with Smithay"
default-run = "wisp"

[lib]
name = "wisp"

[[bin]]
name = "wisp"
path = "src/main.rs"

[[bin]]
name = "wispctl"
path = "src/bin/wispctl.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_session_libseat", "backend_libinput", "backend_udev", "desktop", "wayland_frontend", "xwayland"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
wayland-protocols = { version = "0.32", features = ["staging"] }

[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
